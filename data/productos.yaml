# Catálogo de productos que alimenta la sección "Productos".
# precio: precio de referencia aproximado en euros. NO se muestra tal cual en la web
#         (Amazon no permite mostrar precios que no vengan de su API); solo se usa
#         para filtrar y ordenar, y se muestra como rango ("150–300 €").
# relevancia: tu puntuación editorial de 1 a 100 (más alto = aparece antes).
# anadido: fecha en que lo añades al catálogo (para ordenar por "Novedades").
# buscar: texto de búsqueda en Amazon. Si conoces el ASIN, añade  asin: B0XXXXXXXX
# guia / resena: ruta de la guía o reseña donde aparece (opcional).
# foto: foto TUYA del producto (opcional). Súbela a static/img/ y pon  foto: img/nombre.jpg
#       Se usa en tarjetas, fichas y reseñas. Si la API de Amazon da imagen, se usa la de Amazon.

